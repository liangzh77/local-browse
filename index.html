<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBrowse</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── 主题变量 ─────────────────────────────────────── */
:root {
  --bg:       #ffffff;
  --bg2:      #f6f8fa;
  --bg3:      #eaeef2;
  --border:   #d0d7de;
  --text:     #1f2328;
  --text-dim: #656d76;
  --text-hi:  #1f2328;
  --accent:   #0969da;
  --preview-bg: #ffffff;
  --hl-theme: "github";
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;
          --text:#c9d1d9;--text-dim:#8b949e;--text-hi:#f0f6fc;--accent:#58a6ff;
          --preview-bg:#000000;--hl-theme:"github-dark"; }
}
[data-theme="light"] {
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;
  --text:#1f2328;--text-dim:#656d76;--text-hi:#1f2328;--accent:#0969da;
  --preview-bg:#ffffff;
}
[data-theme="dark"] {
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;
  --text:#c9d1d9;--text-dim:#8b949e;--text-hi:#f0f6fc;--accent:#58a6ff;
  --preview-bg:#000000;
}

body {
  font-family: -apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ─────────────────────────────────────────── */
header {
  height: 44px; background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 1rem; gap: 0.75rem; flex-shrink: 0;
}
header h1 { color: var(--text-hi); font-size: 0.95rem; font-weight: 600; }
.hpath {
  flex: 1; color: var(--text-dim); font-size: 0.78rem; font-family: monospace;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.theme-btn, .refresh-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-dim); cursor: pointer; padding: 0.2rem 0.5rem;
  font-size: 0.8rem; transition: color 0.15s;
}
.open-btn {
  background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
  color: white; cursor: pointer; padding: 0.28rem 0.72rem;
  font-size: 0.8rem; transition: filter 0.15s, opacity 0.15s;
}
.theme-btn:hover, .refresh-btn:hover { color: var(--text-hi); }
.open-btn:hover { filter: brightness(1.05); }
.open-btn:disabled { opacity: 0.65; cursor: wait; }
.refresh-btn.spinning { animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Layout ──────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────── */
aside {
  width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0; padding: 0.5rem 0;
}
aside::-webkit-scrollbar { width: 4px; }
aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ti {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.22rem 0.75rem; cursor: pointer;
  font-size: 0.82rem; color: var(--text-dim); user-select: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ti:hover { background: var(--bg3); color: var(--text); }
.ti.active { background: var(--bg3); color: var(--accent); font-weight: 500; }
.ti .arr { flex-shrink: 0; width: 10px; font-size: 0.6rem; opacity: 0.6; }
.ti .ic  { flex-shrink: 0; }
.ti .nm  { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.ti .badge {
  flex-shrink: 0; margin-left: auto; border: 1px solid var(--border);
  border-radius: 999px; padding: 0.05rem 0.32rem; font-size: 0.66rem;
  color: var(--text-dim); background: var(--bg);
}
.ti .badge.no { opacity: 0.75; }
.ti.root { color: var(--text-hi); font-weight: 600; }
.ti.root .close-root {
  flex-shrink: 0; width: 20px; height: 20px; border: 1px solid transparent;
  border-radius: 4px; background: transparent; color: var(--text-dim);
  cursor: pointer; line-height: 18px; font-size: 0.85rem;
}
.ti.root .close-root:hover { border-color: var(--border); color: var(--text-hi); background: var(--bg); }
.tc { display: none; }
.tc.open { display: block; }

/* ── Main ────────────────────────────────────────────── */
main { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; background: var(--preview-bg); }
main::-webkit-scrollbar { width: 6px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Markdown ────────────────────────────────────────── */
.md { max-width: 800px; line-height: 1.7; color: var(--text); background: var(--preview-bg); }
.md h1,.md h2,.md h3,.md h4 { color: var(--text-hi); margin: 1.5rem 0 0.75rem; font-weight: 600; }
.md h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
.md h2 { font-size: 1.35rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
.md h3 { font-size: 1.1rem; }
.md p  { margin: 0.6rem 0; }
.md a  { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md strong { color: var(--text-hi); }
.md code {
  font-family: "Cascadia Code","Fira Code",Consolas,monospace; font-size: 0.85em;
  background: var(--bg3); padding: 0.15em 0.4em; border-radius: 4px;
}
.md pre {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem; overflow-x: auto; margin: 1rem 0;
}
.md pre code { background: none; padding: 0; font-size: 0.85rem; }
.md blockquote { border-left: 3px solid var(--border); padding-left: 1rem; color: var(--text-dim); margin: 0.75rem 0; }
.md table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.88rem; }
.md th,.md td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; }
.md th { background: var(--bg2); color: var(--text-hi); }
.md tr:nth-child(even) td { background: var(--bg2); }
.md ul,.md ol { padding-left: 1.5rem; margin: 0.5rem 0; }
.md li { margin: 0.25rem 0; }
.md li input[type=checkbox] { margin-right: 0.4rem; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
.md img { max-width: 100%; border-radius: 6px; }

/* ── 代码文件 ────────────────────────────────────────── */
.codefile {
  max-width: 900px;
  background: var(--preview-bg); border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden;
}
.codefile-header {
  padding: 0.5rem 1rem; border-bottom: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-dim); font-family: monospace;
}
.codefile pre { padding: 1rem; overflow-x: auto; margin: 0; background: none; }
.codefile pre code { font-size: 0.83rem; }
.codefile .hljs, .md pre .hljs { background: var(--preview-bg); }

/* ── 图片 ────────────────────────────────────────────── */
.imgview { max-width: 800px; background: var(--preview-bg); }
.imgview img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); }
.imgview .caption { margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-dim); font-family: monospace; }
.caption { margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-dim); font-family: monospace; }

/* ── SVG ─────────────────────────────────────────────── */
.svgview { max-width: 800px; }
.svgview svg { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--preview-bg); padding: 1rem; }
.svgview .caption { margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-dim); font-family: monospace; }

/* ── 纯文本 ──────────────────────────────────────────── */
.txtview {
  max-width: 800px; background: var(--preview-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 1rem;
}
.txtview pre { font-family: "Cascadia Code",Consolas,monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }

/* ── 消息 ────────────────────────────────────────────── */
.msg {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 60vh; gap: 0.75rem;
  color: var(--text-dim); text-align: center;
}
.msg code {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 0.4rem 0.8rem; border-radius: 6px; font-family: monospace; color: var(--accent);
}
</style>
<!-- highlight.js: 两套主题，按主题切换显示 -->
<link id="hl-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hl-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>

<header>
  <h1>LocalBrowse</h1>
  <span class="hpath" id="hpath">—</span>
  <button class="open-btn" id="open-folder-btn" title="选择要浏览的文件夹">打开文件夹</button>
  <button class="refresh-btn" id="refresh-btn" title="刷新文件树">↻</button>
  <button class="theme-btn" id="theme-btn" title="切换明暗主题">🌓</button>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"><div class="msg"><span>加载中…</span></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
// ── 主题 ──────────────────────────────────────────────
const html = document.documentElement;
const saved = localStorage.getItem('theme');
if (saved) html.dataset.theme = saved;

function activeTheme() {
  return html.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function syncHighlightTheme() {
  const dark = activeTheme() === 'dark';
  document.getElementById('hl-light').disabled = dark;
  document.getElementById('hl-dark').disabled = !dark;
}

syncHighlightTheme();

document.getElementById('theme-btn').addEventListener('click', () => {
  const cur = html.dataset.theme;
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if (!cur) next = sysDark ? 'light' : 'dark';
  else if (cur === 'dark') next = 'light';
  else next = 'dark';
  html.dataset.theme = next;
  localStorage.setItem('theme', next);
  syncHighlightTheme();
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!html.dataset.theme) syncHighlightTheme();
});

// ── 文件类型判断 ──────────────────────────────────────
const EXT_LANG = {
  py:'python', js:'javascript', ts:'typescript', jsx:'javascript', tsx:'typescript',
  cpp:'cpp', c:'c', h:'cpp', ino:'cpp',
  json:'json', yaml:'yaml', yml:'yaml',
  css:'css', html:'xml', sh:'bash', bat:'batch',
  rs:'rust', go:'go', java:'java', rb:'ruby', php:'php',
  swift:'swift', kt:'kotlin', sql:'sql', toml:'toml', md:'markdown',
  scad:'javascript', xml:'xml', csv:'plaintext', r:'r', m:'matlab',
  lua:'lua', dart:'dart', tf:'plaintext', proto:'protobuf',
  conf:'plaintext', cfg:'plaintext', properties:'plaintext', gradle:'groovy',
  mod:'plaintext', sum:'plaintext', gitignore:'plaintext',
};

function fileIcon(kind, ext) {
  if (kind === 'image')                   return '🖼️';
  if (kind === 'audio')                   return '🎵';
  if (kind === 'video')                   return '🎬';
  if (kind === 'pdf')                     return '📄';
  if (kind === 'binary' || kind === 'unreadable') return '📦';
  if (ext === 'md')                      return '📝';
  if (['png','jpg','jpeg','gif','webp'].includes(ext)) return '🖼';
  if (ext === 'svg')                     return '🎨';
  if (ext === 'txt')                     return '📄';
  if (['json','yaml','yml','toml'].includes(ext))      return '⚙️';
  if (['py','js','ts','jsx','tsx','rs','go','java','rb','php','swift','kt'].includes(ext)) return '💻';
  if (['cpp','c','h','ino'].includes(ext)) return '🔧';
  if (['sh','bat'].includes(ext))        return '▶';
  return '📄';
}

function previewLabel(node) {
  if (!node.previewable) return '不可预览';
  const labels = {
    markdown: 'Markdown',
    html: 'HTML',
    svg: 'SVG',
    image: '图片',
    audio: '音频',
    video: '视频',
    pdf: 'PDF',
    code: '文本',
    text: '文本',
  };
  return labels[node.previewKind] || '可预览';
}

function rawFileUrl(rootId, path) {
  return '/root/' + encodeURIComponent(rootId) + '/' + path.split('/').map(encodeURIComponent).join('/');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]));
}

function currentPreviewBg() {
  return getComputedStyle(document.documentElement).getPropertyValue('--preview-bg').trim() || '#ffffff';
}

function renderFramePreview(rootId, path) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.style.padding = '0';

  const iframe = document.createElement('iframe');
  iframe.src = rawFileUrl(rootId, path);
  iframe.style.cssText = `width:100%;height:calc(100vh - 44px);border:none;display:block;background:${currentPreviewBg()};`;
  iframe.addEventListener('load', () => {
    try {
      const doc = iframe.contentDocument;
      if (!doc) return;
      doc.documentElement.style.background = currentPreviewBg();
      if (doc.body) {
        doc.body.style.background = currentPreviewBg();
        doc.body.style.colorScheme = html.dataset.theme === 'dark' ? 'dark' : 'light';
      }
    } catch {
      // Browser plugins and some documents may not expose a DOM.
    }
  });

  main.appendChild(iframe);
}

// ── marked 配置 ───────────────────────────────────────
marked.use({
  renderer: {
    link(href, title, text) {
      if (href && !/^(https?:|mailto:|#)/i.test(href)) {
        const safeHref = String(href).replace(/"/g, '&quot;');
        const safeText = text ?? href;
        const titleAttr = title ? ` title="${String(title).replace(/"/g, '&quot;')}"` : '';
        return `<a href="#" data-file-link="${safeHref}"${titleAttr}>${safeText}</a>`;
      }
      const titleAttr = title ? ` title="${String(title).replace(/"/g, '&quot;')}"` : '';
      return `<a href="${href || '#'}"${titleAttr}>${text ?? href ?? ''}</a>`;
    },
    code(code, lang) {
      const language = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
      const highlighted = hljs.highlight(code, { language }).value;
      return `<pre><code class="hljs language-${language}">${highlighted}</code></pre>`;
    }
  },
  gfm: true,
});

// ── 文件树渲染 ────────────────────────────────────────
let roots = [];
let activeFile = null;
let fileInfoByKey = new Map();

function fileKey(rootId, path) {
  return `${rootId}:${path}`;
}

function indexFiles(rootId, nodes) {
  nodes.forEach(node => {
    if (node.type === 'dir') indexFiles(rootId, node.children || []);
    else fileInfoByKey.set(fileKey(rootId, node.path), { ...node, rootId });
  });
}

function findRoot(rootId) {
  return roots.find(root => root.id === rootId) || null;
}

function normalizePath(path) {
  const parts = [];
  path.replace(/\\/g, '/').split('/').forEach(part => {
    if (!part || part === '.') return;
    if (part === '..') {
      parts.pop();
      return;
    }
    parts.push(part);
  });
  return parts.join('/');
}

function resolveRelativePath(fromPath, targetPath) {
  if (!targetPath) return '';
  if (/^(https?:|mailto:|#)/i.test(targetPath)) return targetPath;
  if (targetPath.startsWith('/')) return normalizePath(targetPath.slice(1));
  const baseParts = fromPath.split('/');
  baseParts.pop();
  return normalizePath([...baseParts, targetPath].join('/'));
}

function renderTree(root, nodes, container, depth = 0) {
  nodes.forEach(node => {
    const pad = `${1.25 + depth * 0.875}rem`;
    if (node.type === 'dir') {
      const row = document.createElement('div');
      row.className = 'ti';
      row.style.paddingLeft = pad;
      row.innerHTML = `<span class="arr">▶</span><span class="ic">📁</span><span class="nm">${escapeHtml(node.name)}</span>`;

      const kids = document.createElement('div');
      kids.className = 'tc';
      renderTree(root, node.children || [], kids, depth + 1);

      row.addEventListener('click', () => {
        const open = kids.classList.toggle('open');
        row.querySelector('.arr').textContent = open ? '▼' : '▶';
      });
      container.appendChild(row);
      container.appendChild(kids);
    } else {
      const ext = node.ext || node.name.split('.').pop().toLowerCase();
      const row = document.createElement('div');
      row.className = 'ti';
      row.dataset.root = root.id;
      row.dataset.path = node.path;
      row.title = `${root.path} / ${node.path} - ${previewLabel(node)}`;
      row.style.paddingLeft = pad;
      row.innerHTML = `<span class="arr"></span><span class="ic">${fileIcon(node.previewKind, ext)}</span><span class="nm">${escapeHtml(node.name)}</span><span class="badge ${node.previewable ? '' : 'no'}">${escapeHtml(previewLabel(node))}</span>`;
      row.addEventListener('click', () => loadFile(root.id, node.path));
      container.appendChild(row);
    }
  });
}

function renderRoot(root, container) {
  const row = document.createElement('div');
  row.className = 'ti root';
  row.dataset.rootHeader = root.id;
  row.title = root.path;
  row.innerHTML = `
    <span class="arr">▼</span>
    <span class="ic">📁</span>
    <span class="nm">${escapeHtml(root.name)}</span>
    <button class="close-root" title="Close folder" aria-label="Close folder">×</button>`;

  const kids = document.createElement('div');
  kids.className = 'tc open';
  renderTree(root, root.items || [], kids, 0);

  row.addEventListener('click', () => {
    const open = kids.classList.toggle('open');
    row.querySelector('.arr').textContent = open ? '▼' : '▶';
  });
  row.querySelector('.close-root').addEventListener('click', (event) => {
    event.stopPropagation();
    removeRoot(root.id);
  });

  container.appendChild(row);
  container.appendChild(kids);
}

function setActive(file) {
  document.querySelectorAll('.ti[data-path]').forEach(el => {
    const isActive = file && el.dataset.root === file.rootId && el.dataset.path === file.path;
    el.classList.toggle('active', isActive);
    if (isActive) {
      let p = el.parentElement;
      while (p && p.id !== 'sidebar') {
        if (p.classList.contains('tc')) {
          p.classList.add('open');
          const prev = p.previousElementSibling;
          if (prev) {
            const a = prev.querySelector('.arr');
            if (a) a.textContent = '▼';
          }
        }
        p = p.parentElement;
      }
    }
  });
}

async function loadFile(rootId, path) {
  activeFile = { rootId, path };
  updateHeaderPath(activeFile);
  document.getElementById('main').innerHTML = '<div class="msg"><span>Loading...</span></div>';
  document.getElementById('main').style.padding = '';
  setActive(activeFile);

  const info = fileInfoByKey.get(fileKey(rootId, path)) || { previewable: true, previewKind: 'text', ext: path.split('.').pop().toLowerCase() };
  const kind = info.previewKind;

  if (!info.previewable) {
    document.getElementById('main').innerHTML = `
      <div class="msg">
        <span>This file is listed, but cannot be previewed.</span>
        <code>${escapeHtml(path)}</code>
      </div>`;
    return;
  }

  if (kind === 'image') {
    document.getElementById('main').innerHTML = `
      <div class="imgview">
        <img src="${rawFileUrl(rootId, path)}" alt="${escapeHtml(path)}">
        <div class="caption">${escapeHtml(path)}</div>
      </div>`;
    return;
  }

  if (kind === 'audio') {
    document.getElementById('main').innerHTML = `
      <div class="imgview">
        <audio src="${rawFileUrl(rootId, path)}" controls style="width:100%"></audio>
        <div class="caption">${escapeHtml(path)}</div>
      </div>`;
    return;
  }

  if (kind === 'video') {
    document.getElementById('main').innerHTML = `
      <div class="imgview">
        <video src="${rawFileUrl(rootId, path)}" controls style="max-width:100%;max-height:70vh;border:1px solid var(--border);border-radius:6px"></video>
        <div class="caption">${escapeHtml(path)}</div>
      </div>`;
    return;
  }

  if (kind === 'pdf' || kind === 'html') {
    renderFramePreview(rootId, path);
    return;
  }

  try {
    const res = await fetch(`/api/file?root=${encodeURIComponent(rootId)}&path=${encodeURIComponent(path)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { content, ext, kind: detectedKind, truncated } = await res.json();
    renderContent(rootId, detectedKind || kind, content, path, ext, truncated);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="msg"><span>Read failed: ${escapeHtml(e.message)}</span></div>`;
  }
}

function updateHeaderPath(file = null) {
  const root = file ? findRoot(file.rootId) : null;
  const display = file && root ? `${root.path} / ${file.path}` : (roots.length ? `${roots.length} folder(s) open` : 'No folders open');
  document.getElementById('hpath').textContent = display;
  document.getElementById('hpath').title = display;
}

function renderContent(rootId, kind, content, path, ext, truncated = false) {
  const main = document.getElementById('main');
  const truncatedNote = truncated ? '<div class="caption">Large file, showing first 2 MB only.</div>' : '';

  if (kind === 'markdown') {
    const div = document.createElement('div');
    div.className = 'md';
    div.innerHTML = marked.parse(content);
    div.querySelectorAll('input[type=checkbox]').forEach(cb => cb.disabled = true);
    div.querySelectorAll('a[data-file-link]').forEach(a => {
      const href = a.getAttribute('data-file-link');
      if (!href) return;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        loadFile(rootId, resolveRelativePath(path, href));
      });
    });
    main.innerHTML = '';
    main.appendChild(div);

  } else if (kind === 'svg') {
    main.innerHTML = `
      <div class="svgview">
        ${content}
        <div class="caption">${escapeHtml(path)}</div>
      </div>`;

  } else if (kind === 'text') {
    const div = document.createElement('div');
    div.className = 'txtview';
    const pre = document.createElement('pre');
    pre.textContent = content;
    div.appendChild(pre);
    if (truncated) {
      const note = document.createElement('div');
      note.className = 'caption';
      note.textContent = 'Large file, showing first 2 MB only.';
      div.appendChild(note);
    }
    main.innerHTML = '';
    main.appendChild(div);

  } else {
    const lang = EXT_LANG[ext] || 'plaintext';
    const highlighted = hljs.getLanguage(lang)
      ? hljs.highlight(content, { language: lang }).value
      : hljs.highlightAuto(content).value;

    main.innerHTML = `
      <div class="codefile">
        <div class="codefile-header">${escapeHtml(path)}</div>
        <pre><code class="hljs">${highlighted}</code></pre>
        ${truncatedNote}
      </div>`;
  }
}

function setTreeData(nextRoots) {
  roots = nextRoots || [];
  fileInfoByKey = new Map();
  roots.forEach(root => indexFiles(root.id, root.items || []));

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  roots.forEach(root => renderRoot(root, sidebar));
}

function findDefaultFile() {
  for (const root of roots) {
    const direct = (root.items || []).find(node => node.type === 'file' && ['README.md', 'index.md'].includes(node.path));
    if (direct) return { rootId: root.id, path: direct.path };
  }
  return null;
}

async function loadTree() {
  try {
    const tree = await fetch('/api/tree').then(r => r.json());
    setTreeData(tree.roots || []);
    updateHeaderPath(activeFile);

    if (activeFile) {
      const selector = `.ti[data-root="${CSS.escape(activeFile.rootId)}"][data-path="${CSS.escape(activeFile.path)}"]`;
      if (document.querySelector(selector)) setActive(activeFile);
      else activeFile = null;
    }

    if (!activeFile) {
      const defaultFile = findDefaultFile();
      if (defaultFile) loadFile(defaultFile.rootId, defaultFile.path);
      else document.getElementById('main').innerHTML = '<div class="msg"><span>Select a file from the left.</span></div>';
    }
  } catch (e) {
    document.getElementById('sidebar').innerHTML =
      `<div style="padding:1rem;color:var(--text-dim);font-size:0.8rem">Load failed: ${escapeHtml(e.message)}</div>`;
  }
}

async function removeRoot(rootId) {
  const root = findRoot(rootId);
  if (!root) return;
  try {
    const res = await fetch('/api/remove-root', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ root: rootId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (activeFile && activeFile.rootId === rootId) activeFile = null;
    setTreeData(data.roots || []);
    updateHeaderPath(activeFile);
    if (!activeFile) document.getElementById('main').innerHTML = '<div class="msg"><span>Folder closed. Select another file.</span></div>';
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="msg"><span>Close folder failed: ${escapeHtml(e.message)}</span></div>`;
  }
}

async function init() {
  if (location.protocol === 'file:') {
    document.getElementById('main').innerHTML = `
      <div class="msg">
        <span>Please start the local server first.</span>
        <code>start.bat</code>
      </div>`;
    return;
  }

  await loadTree();
}

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  await loadTree();
  btn.classList.remove('spinning');
});

document.getElementById('open-folder-btn').addEventListener('click', async () => {
  const btn = document.getElementById('open-folder-btn');
  btn.disabled = true;
  btn.textContent = 'Choosing...';
  try {
    const res = await fetch('/api/select-root', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      setTreeData(data.roots || []);
      updateHeaderPath(activeFile);
      document.getElementById('main').innerHTML = '<div class="msg"><span>Folder added. Select a file from the left.</span></div>';
    } else if (!data.cancelled) {
      document.getElementById('main').innerHTML =
        `<div class="msg"><span>Open folder failed: ${escapeHtml(data.error || 'Unknown error')}</span></div>`;
    }
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="msg"><span>Open folder failed: ${escapeHtml(e.message)}</span></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '打开文件夹';
  }
});

init();
</script>
</body>
</html>
